<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps Pipeline Demo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main>
        <h1>DevOps Pipeline Demo App</h1>
        <p class="subtitle">Deployed to AWS EC2 via GitHub Actions &amp; Terraform</p>

        <form method="POST" action="/">
            <input type="text" name="name" placeholder="Your name" maxlength="50">
            <textarea name="message" placeholder="Leave a message..." maxlength="280" required></textarea>
            <button type="submit">Post message</button>
        </form>

        <section class="messages">
            {% if messages %}
                {% for m in messages %}
                <div class="message">
                    <strong>{{ m['name'] }}</strong>
                    <span class="timestamp">{{ m['created_at'] }}</span>
                    <p>{{ m['message'] }}</p>
                </div>
                {% endfor %}
            {% else %}
                <p class="empty">No messages yet — be the first!</p>
            {% endif %}
        </section>
    </main>
</body>
</html>
